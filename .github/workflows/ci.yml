name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Rust
        working-directory: prover
        run: cargo test -p leash-risk && cargo build -p leash-risk-cli
      - name: Forge
        working-directory: contracts
        run: forge test
      - name: Pytest
        run: PYTHONPATH=agent pytest -q agent/tests prover/reference/test_ewma_numpy.py services/test_orchestrator.py
      - name: Harness
        run: python bench/leashbench.py
      - name: Gas samples
        run: python bench/gas_samples.py
      - name: Figures
        run: |
          python bench/plot_results.py
          MPLCONFIGDIR=/tmp/mpl python paper/tools/fig_architecture.py
      - name: Paper
        if: hashFiles('zkLeash_IEEE_paper_revised.docx') != ''
        run: python paper/tools/revise_docx.py
